name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so we can diff against the previous tag

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: auger-build # same key as ci.yml: restore the cache CI built on main
          save-if: false # tag runs are ref-scoped and can't be reused; only restore

      - name: Cache Tauri NSIS toolchain
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-nsis-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: tauri-nsis-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Set app version from tag
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e "const f='src-tauri/tauri.conf.json';const j=require('./'+f);j.version='$V';require('fs').writeFileSync(f, JSON.stringify(j,null,2)+'\n')"
          echo "App version set to $V"

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..${GITHUB_REF_NAME}"; else range="${GITHUB_REF_NAME}"; fi
          log=$(git log --no-merges --pretty=format:'- %s' "$range")
          [ -z "$log" ] && log="- Maintenance release."
          echo "Changelog for $range:"; echo "$log"
          {
            echo "notes<<CHANGELOG_EOF"
            echo "What's changed:"
            echo ""
            echo "$log"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AUGER_RELEASE: "1" # marks this as a release build so the app enables auto-update
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Auger ${{ github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: false
          prerelease: false

      # The symbols for the binary this release actually ships.
      #
      # A PDB is matched to an exe by a GUID both carry, stamped at link time,
      # so only the PDB from THIS build can name the frames in a stack from THIS
      # installer. Rebuilding the same tag later does not reproduce it: the
      # v0.58.0 rebuild came out 8,496 bytes apart in .text with a different
      # GUID, and every debugger refuses it. Without this step a report from a
      # shipped build reads `Auger.exe+0x1d9add` and stays unreadable; with it,
      # the same frame reads `tao … EventLoop::run`. Cargo's release defaults
      # emit no debuginfo, but the linker still writes a PDB with the public
      # symbols, which is what names those frames — 12 MB, kept per release.
      - name: Publish debug symbols
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          cp src-tauri/target/release/Auger.pdb "Auger_${V}_x64.pdb"
          gh release upload "${GITHUB_REF_NAME}" "Auger_${V}_x64.pdb" --clobber
